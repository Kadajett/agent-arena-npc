# Zella Fair. Her authored lore is the record: she does not accumulate a
# generated autobiography, task list, standing orders, or saved Pi session.
ARENA_PLAYER_NAME="${ARENA_PLAYER_NAME:-Zella Fair}"

NPC_MODEL="${NPC_MODEL:-openrouter/inclusionai/ling-3.0-flash}"
NPC_THINKING="${NPC_THINKING:-low}"

NPC_MEMORY_ENABLED="${NPC_MEMORY_ENABLED:-0}"
NPC_SESSION_ENABLED="${NPC_SESSION_ENABLED:-0}"
NPC_TODO_ENABLED="${NPC_TODO_ENABLED:-0}"
NPC_REFLEXES_ENABLED="${NPC_REFLEXES_ENABLED:-0}"

# Keep speech on the authored system prompt. A second model must not rewrite
# her dialogue into the room's current register.
NPC_VOICE_PROFILE=""
NPC_VOICE_REMINDER="${NPC_VOICE_REMINDER:-Playful, observant, practical, and sharper than you first sound. Speak from the authored Zella lines and ordinary singer work. Never borrow seals, counts, omens, or invented history from the room. Sing often, but use ordinary speech and movement too. @Name only to address someone.}"

NPC_AUTONOMOUS="${NPC_AUTONOMOUS:-1}"
NPC_TICK_SECONDS="${NPC_TICK_SECONDS:-120}"
NPC_TICK_PROMPT="${NPC_TICK_PROMPT:-(Autonomy tick, not a player speaking. Do not reply to this text.) Observe the room once. Answer anyone who addressed you. Join a recent performance with a new sweeping voice counterline; otherwise choose one useful action from speech, movement, listening, or a solo. Do not repeat a solo or phrase. Keep the turn short.}"
