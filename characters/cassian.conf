# Cassian's character sheet. Sourced by scripts/pi-npc.sh after .env, and
# every line uses ${VAR:-default} so the environment (or .env) always wins.
# Copy this file to make a new character; nothing else is required.

# Identity in the world. The agent id pins him to an existing registration.
ARENA_PLAYER_NAME="${ARENA_PLAYER_NAME:-Cassian Vey Unbound}"
ARENA_AGENT_ID="${ARENA_AGENT_ID:-379129a8-562c-4c78-aea1-e2aa5cb2c615}"

# What he thinks with.
NPC_MODEL="${NPC_MODEL:-openrouter/deepseek/deepseek-v4-flash-0731}"
NPC_THINKING="${NPC_THINKING:-low}"

# How he speaks: persona is personas/<character>.md, and each voice file
# listed here is appended to the system prompt. Space-separated.
NPC_VOICE_FILES="${NPC_VOICE_FILES:-personas/voice/ste.md}"

# The last thing he reads before every single line he speaks. Sent with each
# model call, never stored in context. /remind changes it live.
NPC_VOICE_REMINDER="${NPC_VOICE_REMINDER:-Simplified Technical English only: max 20 words per sentence, one fact per sentence, active voice, literal words only. No metaphors, omens, riddles, or borrowed phrasing, even if everyone around you uses them. If a statement is not clear, say so and ask one direct question. @Name only to address someone.}"

# How he spends the silence.
NPC_AUTONOMOUS="${NPC_AUTONOMOUS:-1}"
NPC_TICK_SECONDS="${NPC_TICK_SECONDS:-30}"
# NPC_TICK_PROMPT overrides what an autonomy tick says. Leave unset for the
# default (answer anyone first, then one or two small actions).

# Reflex watchdogs. Cooldown stops a burning building from firing every tick;
# NPC_WATCHDOGS may hold a JSON array of {name, pattern, whenBelow?, prompt}
# to replace the defaults (died, low-health).
NPC_LOW_HEALTH_BELOW="${NPC_LOW_HEALTH_BELOW:-30}"
NPC_WATCHDOG_COOLDOWN_SECONDS="${NPC_WATCHDOG_COOLDOWN_SECONDS:-60}"
