[package]
name = "agent-arena-npc-harness"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rig + Ractor multi-brain runtime for Agent Arena NPCs"
default-run = "agent-arena-npc-harness"

[features]
default = ["local-rag"]
compat-hardcoded-skills = []
local-rag = ["dep:rig-fastembed"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
num-traits = "0.2"
ractor = "0.16.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rig-agent = "0.41.0"
rig-core = "0.41.0"
rig-fastembed = { version = "0.41.0", optional = true, default-features = false, features = ["hf-hub", "hf-hub-rustls-tls", "ort-download-binaries"] }
rig-memory = "0.41.0"
schemars = { version = "1.0", features = ["chrono04", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }

[dev-dependencies]
pretty_assertions = "1.4"
rig-core = { version = "0.41.0", features = ["test-utils"] }
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
